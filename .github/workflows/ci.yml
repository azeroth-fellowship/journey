name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The companion imports the libraries through their dist/, so build them before checking.
      - run: pnpm build:libs
      - run: pnpm typecheck && pnpm test
      - name: Every first-party source file has an SPDX header
        run: pnpm spdx:check

  rust:
    name: Companion (cargo check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev
      - run: mkdir -p apps/desktop/dist
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
