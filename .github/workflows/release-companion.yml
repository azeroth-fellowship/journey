name: Release companion

# Tag `companion-v<semver>` (see docs/releasing.md). Independent from the addon (`addon-v*`).
on:
  push:
    tags: ['companion-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. companion-v0.1.0'
        required: true
        type: string
      dry_run:
        description: 'Build and upload the installers as workflow artifacts only (no GitHub Release, no latest.json)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-companion-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify tag, version and configuration
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Tag matches the version in package.json, tauri.conf.json and Cargo.toml
        id: v
        run: |
          if [[ ! "$TAG" =~ ^companion-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not of the form companion-v<semver> (e.g. companion-v0.1.0)."; exit 1
          fi
          node apps/desktop/scripts/bump-companion-version.mjs --check "$TAG" || {
            echo "::error::The version files do not match tag $TAG. Run 'node apps/desktop/scripts/bump-companion-version.mjs <version>', commit, delete the tag and re-tag."; exit 1; }
          version="${TAG#companion-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Release configuration is complete
        env:
          COMPANION_API_URL: ${{ vars.COMPANION_API_URL }}
          COMPANION_WEB_URL: ${{ vars.COMPANION_WEB_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=0
          [ -n "$COMPANION_API_URL" ] || { echo "::error::Repository variable COMPANION_API_URL is not set (public API base URL baked into the build as VITE_API_URL)."; missing=1; }
          [ -n "$COMPANION_WEB_URL" ] || { echo "::error::Repository variable COMPANION_WEB_URL is not set (website URL baked into the build as VITE_WEB_URL and AZEROTH_WEB_URL)."; missing=1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set (updater signing key, see docs/releasing.md)."; missing=1; }
          exit $missing
      - name: Updater public key and repo are configured
        run: node apps/desktop/scripts/prepare-release-config.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    # Only Windows is supported. Linux and macOS are best-effort and never block the release.
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            experimental: false
            bundles: nsis
          - name: linux (experimental)
            os: ubuntu-22.04
            experimental: true
            bundles: appimage,deb
          - name: macos (experimental)
            os: macos-latest
            experimental: true
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev
      - run: pnpm install --frozen-lockfile
      # Only the companion's own workspace dependencies (contracts, api-client), not the whole repo.
      - run: pnpm --filter "@azeroth/desktop^..." build
      - name: Generate release config (updater key + feed URL)
        working-directory: apps/desktop
        run: node scripts/prepare-release-config.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Changelog
        id: changelog
        shell: bash
        run: |
          bash .github/scripts/changelog.sh companion-v apps/desktop "$TAG" > "$RUNNER_TEMP/changelog.md"
          cat "$RUNNER_TEMP/changelog.md"
          {
            echo 'body<<CHANGELOG_EOF'
            cat "$RUNNER_TEMP/changelog.md"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build, sign and upload to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the build: the frontend reads VITE_*, the Rust side reads AZEROTH_WEB_URL (the only site it opens).
          VITE_API_URL: ${{ vars.COMPANION_API_URL }}
          VITE_WEB_URL: ${{ vars.COMPANION_WEB_URL }}
          AZEROTH_WEB_URL: ${{ vars.COMPANION_WEB_URL }}
        with:
          projectPath: apps/desktop
          # An empty tagName makes the action build without creating a release (dry run).
          tagName: ${{ inputs.dry_run != true && env.TAG || '' }}
          releaseName: 'Azeroth Journey Companion ${{ needs.verify.outputs.version }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          # Draft until every required build is uploaded, so latest.json never points at a half-finished release.
          releaseDraft: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.generated.conf.json --bundles ${{ matrix.bundles }}
      - name: Keep installers from a dry run
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v7
        with:
          name: companion-${{ runner.os }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: warn

  publish:
    name: Publish release
    needs: [verify, build]
    # Reached only when the (non-experimental) Windows build succeeded.
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest="$([ "${{ needs.verify.outputs.prerelease }}" = true ] && echo false || echo true)"
